  <circle cx="300" cy="200" r="96" fill="none" stroke="#185FA5" stroke-width="5"/>
  <g stroke="#185FA5" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="112" x2="300" y2="126"/>
    <line x1="300" y1="112" x2="300" y2="126" transform="rotate(30 300 200)"/>
