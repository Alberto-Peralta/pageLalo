<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de noticias - Notica</title>
<link rel="stylesheet" href="../portada.css">
<link rel="stylesheet" href="noticias.css">
</head>
<body class="pn">
<header class="pn-top">
<a href="../" class="logo"><img src="../icons/logo-nav-oscuro.png" alt="Notica"></a>
<a class="nt-volver" href="../">&larr; Inicio</a>
</header>
<main class="nt-main">
<h1>Panel de noticias</h1>

<section id="pantallaLogin" class="caja">
<form id="formLogin">
<label>Correo<input type="email" id="email" required></label>
<label>Contraseña<input type="password" id="clave" required></label>
<button type="submit">Entrar</button>
<p id="errorLogin" class="error"></p>
</form>
</section>

<div id="panel" style="display:none">
<p>Sesión: <span id="correo"></span> | Rol: <span id="rol"></span> <button id="salir" class="sec">Salir</button></p>
<section id="seccionNoticia" class="caja">
<h2>Nueva publicación</h2>
<form id="formNoticia">
<label>Tipo<select id="noticiaTipo"><option value="noticia">Noticia</option><option value="evento">Evento</option><option value="aviso">Aviso</option><option value="video">Video</option></select></label>
<label>Parroquia<select id="noticiaParroquia" required></select></label>
<label>Título<input type="text" id="noticiaTitulo" required maxlength="140"></label>
<label>Texto<textarea id="noticiaCuerpo" rows="8" required></textarea></label>
<label>Fecha y hora del evento (solo eventos)<input type="datetime-local" id="noticiaFecha"></label>
<label>Lugar (solo eventos)<input type="text" id="noticiaLugar"></label>
<label>Enlace de video (YouTube se muestra incrustado; otros, como Facebook, quedan como enlace "Ver video")<input type="url" id="noticiaVideo"></label>
<label>Fuentes (una por línea: Título | enlace)<textarea id="noticiaFuentes" rows="3"></textarea></label>
<button type="submit">Enviar a revisión</button>
</form>
<p id="resultadoNoticia"></p>
<h2>Publicaciones pendientes</h2>
<ul id="listaPendientes"></ul>
</section>

<section id="seccionParroquias" class="caja" style="display:none">
<h2>Parroquias</h2>
<form id="formParroquia">
<label>Nombre<input type="text" id="parroquiaNombre" required></label>
<label>Decanato<input type="text" id="parroquiaDecanato"></label>
<button type="submit">Guardar parroquia</button>
<button type="button" id="crearMundo" class="sec">Crear Iglesia en el mundo</button>
<button type="button" id="importarTemplos" class="sec">Importar desde Templos</button>
</form>
<p id="resultadoParroquia"></p>
<ul id="listaParroquias"></ul>
</section>
</div>
</main>
<script type="module" src="panel.js"></script>
</body>
</html>
