<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de misas y más - Notica</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="templos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a7d50e2cf06445848a47c594610014ed"}'></script></head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Noti<span>ca</span></div>

            
            <button class="menu-toggle" onclick="window.location.href='../index.html'">
                ← Inicio
            </button>
        </nav>
    </header>

    <main class="templos-main">
        <section class="hero-templos">
            <h1><i class="fas fa-church"></i> Horarios de misas y más</h1>
            <p>Misas, confesiones, hora santa, bautizos y pláticas en los templos de Delicias</p>
        </section>

        <section class="tipos">
            <button type="button" class="tipo-chip activo" data-tipo="misas" onclick="cambiarTipo('misas')">Misas</button>
            <button type="button" class="tipo-chip" data-tipo="confesiones" onclick="cambiarTipo('confesiones')">Confesiones</button>
            <button type="button" class="tipo-chip" data-tipo="hora_santa" onclick="cambiarTipo('hora_santa')">Hora santa</button>
            <button type="button" class="tipo-chip" data-tipo="bautizos" onclick="cambiarTipo('bautizos')">Bautizos</button>
            <button type="button" class="tipo-chip" data-tipo="platicas_matrimonio" onclick="cambiarTipo('platicas_matrimonio')">Pláticas prematrimoniales</button>
            <button type="button" class="tipo-chip" data-tipo="platicas_bautismo" onclick="cambiarTipo('platicas_bautismo')">Pláticas prebautismales</button>
        </section>

        <!-- Filtros y búsqueda -->
        <section class="filtros">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar templo..." onkeyup="filtertemplos()">
            </div>
            <button class="btn-admin-secreto" id="btnAdmin" onclick="window.location.href='admin.html'">
                <i class="fas fa-user-shield"></i> Panel Admin
            </button>
        </section>

        <!-- Contenedor de templos -->
        <section class="templos-container" id="templosContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando Templos...</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Notica. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal para ver detalles -->
    <div id="modalDetalle" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="./templos.js"></script>
</body>
</html>
